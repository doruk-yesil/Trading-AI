# ─────────────────────────────────────────────
# Trading-AI  |  Main Configuration
# ─────────────────────────────────────────────

# Universe
# universe_mode: "sp500"  -> fetch the live S&P 500 constituent list at runtime
#                            (see src/utils/universe.py). `symbols` below is
#                            then just the always-include extras (benchmark etc).
# universe_mode: "manual" -> use exactly the `symbols` list below.
universe_mode: "sp500"

symbols:
  - SPY        # benchmark — always include, not a real S&P 500 constituent

benchmark: SPY

# Date range (YYYY-MM-DD)
# Used only as an optional override / filter. The daily downloader defaults to
# period="max" (earliest available history per symbol) unless these are
# explicitly passed on the CLI.
start_date: "2015-01-01"
end_date:   "2024-12-31"

# Prediction target
# Horizon: matches Doruk's own discretionary swing style (~10-20 trading days).
# 15 chosen as the midpoint -- long enough that daily noise/transaction costs
# don't dominate, short enough to stay responsive. Worth A/B testing 10 vs 15
# vs 20 empirically (walk-forward) once training is implemented -- don't just
# trust this number blindly.
prediction_horizon: 15          # trading days forward

# target_type: "continuous" -> model predicts the actual forward return (%),
# not just a beat/miss flag. Chosen so the output is directly usable for
# position sizing / ranking across the full S&P 500 universe (504 symbols),
# not just a threshold-crossing probability.
# min_return_threshold still matters -- it's applied downstream (in the
# decision/strategy layer, e.g. src/strategies/ml_signal_strategy.py) as the
# minimum predicted edge required to actually trade, not baked into the label.
target_type: "continuous"       # binary | continuous
min_return_threshold: 0.005     # 0.5% — min predicted edge (net of costs) to act on a signal

# Transaction costs
transaction_cost_pct: 0.001    # 0.10% per trade (one-way)
slippage_pct: 0.0005           # 0.05% slippage estimate

# Portfolio
initial_capital: 100000        # USD
position_size_pct: 0.10        # max 10% of capital per position
max_positions: 10              # max simultaneous open positions

# Feature engineering windows
feature_windows:
  moving_averages: [5, 10, 20, 50, 100, 200]
  rsi_period: 14
  macd:
    fast: 12
    slow: 26
    signal: 9
  bollinger_bands:
    window: 20
    num_std: 2
  atr_period: 14
  momentum_windows: [5, 10, 20, 60]
  volume_ma_windows: [5, 20]

# Train / validation / test split
# Walk-forward: retrain every `retrain_every_n_days` days
train_years: 4
validation_years: 1
test_years: 1
retrain_every_n_days: 63       # ~1 quarter

# Sample uniqueness weighting (Lopez de Prado, "Advances in Financial Machine
# Learning"). Each row's label window (forward_return_{horizon}d) overlaps
# with its neighbors' -- every "event" isn't an independent sample the way
# i.i.d. training data assumes. Rows whose label windows overlap heavily with
# many others get down-weighted; rows near the edges of a symbol's history
# (less overlap) get up-weighted closer to 1. See
# src/models/train_baseline_models.py -> compute_uniqueness_weights().
use_sample_weighting: true

# Model
model:
  type: "lightgbm"             # lightgbm | xgboost | baseline_ma | baseline_rsi
  random_seed: 42

# Output paths (relative to project root)
paths:
  raw_data:    "data/raw"
  processed:   "data/processed"
  external:    "data/external"
  reports:     "reports"
  figures:     "reports/figures"
  backtests:   "reports/backtests"
  experiments: "reports/experiments"
